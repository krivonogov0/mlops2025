[tool.poetry]
name = "homework2"
version = "0.1.0"
description = "Monitoring system for FastAPI ONNX image captioning service"
authors = ["MLOps Course"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.25.0"
pyyaml = "^6.0"
pydantic = "^2.5.0"
numpy = "^1.24.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.5.0"
black = "^23.11.0"
flake8 = "^6.1.0"
isort = "^5.12.0"
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
